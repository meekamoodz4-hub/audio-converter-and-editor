name: Build Audio Converter and Editor

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare or restore encrypted upload signing key
        id: signing
        if: github.event_name != 'pull_request' && secrets.UPLOAD_KEY_ENCRYPTION_PASSWORD != ''
        shell: bash
        env:
          KEY_ENCRYPTION_PASSWORD: ${{ secrets.UPLOAD_KEY_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          KEY_DIR="$GITHUB_WORKSPACE/.github/keys"
          ENCRYPTED_KEY="$KEY_DIR/audio-converter-upload.jks.enc"
          mkdir -p "$KEY_DIR"

          if [ -f "$ENCRYPTED_KEY" ]; then
            echo "Restoring the existing encrypted upload key."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENCRYPTED_KEY" -out "$RUNNER_TEMP/audio-converter-upload.jks" -pass env:KEY_ENCRYPTION_PASSWORD
          else
            echo "Creating the upload key for the first time."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/audio-converter-upload.jks" \
              -storetype JKS \
              -storepass "$KEY_ENCRYPTION_PASSWORD" \
              -keypass "$KEY_ENCRYPTION_PASSWORD" \
              -alias audio-converter-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Audio Converter and Editor, OU=Release, O=DropTech Developers, L=Durban, ST=KwaZulu-Natal, C=ZA"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
              -in "$RUNNER_TEMP/audio-converter-upload.jks" \
              -out "$ENCRYPTED_KEY" \
              -pass env:KEY_ENCRYPTION_PASSWORD
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENCRYPTED_KEY"
            git commit -m "Securely store encrypted Play upload key"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          test -s "$RUNNER_TEMP/audio-converter-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/audio-converter-upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEY_ENCRYPTION_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=audio-converter-upload" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_ENCRYPTION_PASSWORD" >> "$GITHUB_ENV"
          echo "has_signing=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK and release Android App Bundle
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Converter-and-Editor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed Play Store AAB
        if: steps.signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Converter-and-Editor-signed-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload unsigned AAB for build verification only
        if: steps.signing.outputs.has_signing != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Converter-and-Editor-unsigned-AAB-NOT-FOR-PLAY
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
