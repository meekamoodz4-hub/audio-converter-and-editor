plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def uploadStorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def uploadStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def uploadKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def uploadKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = [uploadStorePath, uploadStorePassword, uploadKeyAlias, uploadKeyPassword].every { it != null && !it.isEmpty() }

android {
    namespace 'com.meekamoodz.audioconvertereditor'
    compileSdk 36

    defaultConfig {
        applicationId 'com.meekamoodz.audioconvertereditor'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(uploadStorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.9'
}
